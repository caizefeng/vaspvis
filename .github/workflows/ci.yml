name: CI

on:
  push:
  pull_request:

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package into a fresh virtual environment
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install .
          venv/bin/pip check
      - name: Import smoke test (from outside the checkout, so the installed package is used)
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/venv/bin/python" -c "import vaspvis.standard, vaspvis.utils, vaspvis.workflow, vaspvis; print('vaspvis imports fine from', vaspvis.__file__)"
      - name: Unit tests against the installed package
        run: |
          venv/bin/pip install pytest
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/venv/bin/pytest" -q "$GITHUB_WORKSPACE/tests"
